<meta charset="utf-8">
<title>Ovia Master OS</title>

<link rel="icon" id="favicon">
<style>
   
  :root{
    --bg:#0b0e13; --panel:#131820; --panel2:#1a212c; --line:#242d3a; --soft:#1d2531;
    --ink:#e6ebf2; --ink2:#95a1b4; --ink3:#5f6b7d;
    --accent:#3ddc97; --accent-ink:#06120c;
    --bar:#3a6ea5; --bar2:#2a4d72;
    --hot:#e0a458; --cold:#7c8798;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color-scheme:dark;

     
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70;
    --win-1:#1f7a55; --win-2:#2aa877; --win-3:#4fe3a6;
    --awr-1:#31699f; --awr-2:#3f83c6; --awr-3:#5a9ce0; --awr-4:#84b9ee; --awr-5:#b0d5f7;
    --mute:#7c8798;
  }
  @media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
    --bg:#f5f7fa; --panel:#fff; --panel2:#eef1f5; --line:#dbe1e9; --soft:#e7ecf2;
    --ink:#131820; --ink2:#5a6675; --ink3:#8b96a6;
    --accent:#128a5c; --accent-ink:#fff; --bar:#4a7fb5; --bar2:#8fb2d4;
    --hot:#b8791f; --cold:#8b96a6; color-scheme:light;
     
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a;
    --win-1:#0d6b47; --win-2:#149063; --win-3:#2fb98a;
    --awr-1:#123a69; --awr-2:#1c5596; --awr-3:#2e77bd; --awr-4:#5497d8; --awr-5:#7fb4e6;
    --mute:#8b96a6}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
    padding:5px 10px;border-radius:6px;cursor:pointer}
  button:hover{border-color:var(--ink3)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.go{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:650}
  button.sm{font-size:11.5px;padding:3px 9px;border-radius:20px}

  header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    padding:8px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
  .grow{flex:1 1 auto}
  .sub{color:var(--ink3);font-size:11.5px}
  .stale{color:var(--hot)}

   
  #tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:2px}
  #tabs button{border:0;background:none;padding:4px 12px;border-radius:6px;font-size:12.5px;color:var(--ink2)}
  #tabs button.on{background:var(--panel);color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.25)}

   
  #filterbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:8px 16px;
    border-bottom:1px solid var(--line);background:var(--panel);min-height:40px}
  .fchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
    border:1px solid var(--line);border-radius:20px;padding:3px 6px 3px 11px;font-size:12.5px}
  .fchip b{font-weight:650;color:var(--ink2);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  .fchip .x{cursor:pointer;color:var(--ink3);padding:0 4px;border-radius:50%}
  .fchip .x:hover{color:var(--accent)}
  .fchip .or{color:var(--ink3);font-size:11px}

  main{max-width:1600px;margin:0 auto;padding:16px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px 12px;
    position:relative;min-width:0}
  .card.wide{grid-column:span 2}
  .card.full{grid-column:1/-1}
  .card.dragging{opacity:.35}
  .card.over{outline:2px dashed var(--accent);outline-offset:2px}
  .card h3{margin:0 0 2px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink2);padding-right:44px;display:flex;align-items:center;gap:7px}
  .card .sub{margin-bottom:9px}
  .card .tools{position:absolute;top:10px;right:10px;display:flex;gap:2px;opacity:0}
  .card:hover .tools,.card:focus-within .tools{opacity:1}
  .card .tools button{border:0;background:none;color:var(--ink3);padding:2px 5px;font-size:13px;line-height:1}
  .card .tools button:hover{color:var(--ink)}
  .grab{cursor:grab;letter-spacing:-2px}
  .scope{font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:20px;
    border:1px solid var(--line);color:var(--ink3);font-weight:600}
  .scope.range{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .ctl{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;align-items:center}
  .ctl .lab{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-right:1px}
  .recon{margin-top:8px;padding-top:7px;border-top:1px solid var(--soft);font-size:11.5px;color:var(--ink3);
    display:flex;flex-wrap:wrap;gap:4px 14px}
  .recon b{color:var(--ink2);font-family:var(--mono);font-weight:600}

  .bars{display:flex;flex-direction:column;gap:1px}
  .bar-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
    padding:4px 6px;border-radius:5px;cursor:pointer;position:relative}
  .bar-row:hover{background:var(--panel2)}
  .bar-row.active{background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .bar-row .label{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
  .bar-row .count{font-family:var(--mono);font-size:11.5px;color:var(--ink2);z-index:1}
  .bar-row .track{position:absolute;left:0;right:0;top:0;bottom:0;border-radius:5px;overflow:hidden}
  .bar-row .fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);opacity:.30}
  .bar-row.active .fill{background:var(--accent);opacity:.30}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--soft);
    border-radius:9px;overflow:hidden}
  .kpi{background:var(--panel);padding:11px 13px}
  .kpi .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
  .kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;
    letter-spacing:-.02em;margin-top:3px}
  .kpi .d{font-size:11px;margin-top:1px;font-family:var(--mono);color:var(--ink3)}
  .kpi.lead .v{color:var(--accent)}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:right;padding:6px 9px;white-space:nowrap;font-size:12.5px}
  th:first-child,td:first-child{text-align:left}
  thead th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);
    font-weight:650;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  thead th:hover{color:var(--ink)}
  tbody td{border-bottom:1px solid var(--soft);font-family:var(--mono)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.tot td{border-top:1px solid var(--line);border-bottom:0;font-weight:700}
  tbody tr.grp td{background:var(--panel2);font-family:var(--sans);font-weight:650;font-size:11.5px;
    letter-spacing:.03em;color:var(--ink2);border-bottom:1px solid var(--line)}
  td.txt{font-family:var(--sans)}
  td.name{max-width:300px;overflow:hidden;text-overflow:ellipsis}
  tr.click{cursor:pointer} tr.click:hover{background:var(--panel2)}
  .tw{overflow-x:auto;max-height:460px;overflow-y:auto}
  .tw.tall{max-height:700px}
  a.q{color:inherit;text-decoration:none;border-bottom:1px dotted var(--ink3)}
  a.q:hover{border-bottom-color:var(--accent);color:var(--accent)}

   
  .exp{display:inline-block;width:14px;color:var(--ink3);cursor:pointer;user-select:none;
    transition:transform .12s ease}
  .exp:hover{color:var(--accent)}
  .exp.open{transform:rotate(90deg);color:var(--accent)}
  tr.det td{background:var(--panel2);padding:0 9px 9px 26px;border-bottom:1px solid var(--line)}
  tr.det table{background:none} tr.det thead th{border-bottom-color:var(--line)}
  tr.det tbody td{border-bottom:1px solid var(--soft)}

  .ring{width:21px;height:21px;border-radius:50%;display:inline-grid;place-items:center;
    font-size:9.5px;font-weight:700;font-family:var(--mono);border:2px solid var(--cold);color:var(--cold)}
  .ring.w{border-color:var(--hot);color:var(--hot)}
  .pill{display:inline-block;padding:0 7px;border-radius:20px;font-size:11px;background:var(--panel2);
    color:var(--ink2);border:1px solid var(--line);font-family:var(--sans)}
  .who{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:9.5px;
    font-weight:700;font-family:var(--mono);background:var(--soft);color:var(--ink2);border:1px solid var(--line)}
  .empty{color:var(--ink3);font-size:12.5px;padding:8px 2px}

   
   
  .sbar{display:flex;gap:2px;height:20px;border-radius:4px;overflow:hidden;margin:2px 0 8px}
  .sbar i{display:block;height:100%;position:relative;min-width:2px;cursor:default;
    display:grid;place-items:center}
  .sbar i:first-child{border-radius:4px 0 0 4px}
  .sbar i:last-child{border-radius:0 4px 4px 0}
  .sbar i span{font:600 10px/1 var(--mono);color:#08121a;opacity:.92;pointer-events:none}
  .sbar.on-dark i span{color:#f2f7fb}
  .sbar2{margin-top:-2px;margin-bottom:9px;height:12px}
  .sblab{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;
    vertical-align:baseline;flex:0 0 auto}
  .mixrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
    padding:3px 6px;border-radius:5px;cursor:pointer;font-size:12.5px}
  .mixrow:hover{background:var(--panel2)}
  .mixrow.active{background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .mixrow .nm{display:flex;align-items:center;min-width:0}
  .mixrow .nm em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mixrow .n{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
  .mixrow .p{font-family:var(--mono);font-size:12px;font-weight:600;min-width:42px;text-align:right}
  .mixrow.sub .nm{padding-left:15px}
  .mixrow.sub .nm em{color:var(--ink2)}
  .chip{border-color:var(--ink3)}
  .donutwrap{position:relative;width:140px;margin:2px auto 10px}
  .donut{display:block;width:140px;height:140px}
  .donut circle{transition:stroke-width .12s ease}
  .donut circle:hover{stroke-width:23}
  .dcen{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
  .dcen b{display:block;font:700 25px/1 var(--mono);letter-spacing:-.02em;color:var(--ink)}
  .dcen span{display:block;font-size:10.5px;color:var(--ink3);margin-top:3px}
  .hero{display:flex;align-items:baseline;gap:9px;margin:1px 0 7px}
  .hero b{font:700 30px/1 var(--mono);letter-spacing:-.02em;color:var(--accent)}
  .hero span{font-size:11.5px;color:var(--ink3)}
  .arng{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:7px 16px;
    border-bottom:1px solid var(--line);background:var(--panel2)}
  .arng .lab{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}

  .kan{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
  .kcol{flex:0 0 208px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:8px;max-height:560px;display:flex;flex-direction:column}
  .kcol.on{border-color:var(--accent)}
  .kh{cursor:pointer;margin-bottom:7px}
  .kh .t{font-size:11.5px;font-weight:650;display:flex;align-items:baseline;gap:5px}
  .kh .t b{margin-left:auto;font-family:var(--mono);font-size:15px}
  .kh .m{font-size:10.5px;color:var(--ink3);font-family:var(--mono);margin-top:1px}
  .kh .vol{height:3px;border-radius:2px;background:var(--soft);margin-top:5px;overflow:hidden}
  .kh .vol i{display:block;height:100%;background:var(--bar)}
  .kbody{overflow-y:auto;display:flex;flex-direction:column;gap:5px}
  .kcard{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px;
    font-size:11.5px;display:block;color:inherit;text-decoration:none}
  .kcard:hover{border-color:var(--ink3)}
  .kcard .n{font-family:var(--mono);color:var(--ink3);font-size:10.5px}
  .kcard .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    line-height:1.35;margin:1px 0 4px}
  .kcard .ft{display:flex;align-items:center;gap:5px}
  .kcard .ft .sp{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}

   
  .actcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .actcal .dow{font-size:9.5px;color:var(--ink3);text-align:center;text-transform:uppercase;padding-bottom:2px}
  .actcal .cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--panel2);
    position:relative;padding:3px 4px;cursor:pointer;min-height:44px}
  .actcal .cell.blank{border:0;background:none;cursor:default}
  .actcal .cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
  .actcal .cell .dn{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
  .actcal .cell .big{font-family:var(--mono);font-size:16px;font-weight:700;line-height:1.1}
  .actcal .cell .em{font-size:9px;letter-spacing:-1px;position:absolute;bottom:3px;left:4px}
  .actcal .cell.today{border-color:var(--accent)}
  .daydetail{margin-top:10px;border-top:1px solid var(--soft);padding-top:8px}

   
  .strip{display:flex;gap:2px;overflow-x:auto;padding:2px 0 6px}
  .strip .sd{flex:0 0 30px;text-align:center;border-radius:5px;background:var(--panel2);
    border:1px solid var(--line);padding:3px 0 4px;cursor:pointer}
  .strip .sd:hover{border-color:var(--ink3)}
  .strip .sd.sel{border-color:var(--accent)}
  .strip .sd .dw{font-size:8.5px;color:var(--ink3);text-transform:uppercase}
  .strip .sd .dn{font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .strip .sd .v{font-family:var(--mono);font-size:13px;font-weight:700;line-height:1.2}
  .strip .sd .l{font-size:9px;color:var(--accent);height:11px;line-height:11px}

  .pgrid{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
  .pbtn{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 7px;border-radius:20px}
  .pbtn .who{width:22px;height:22px}
  .pbtn small{color:var(--ink3);font-size:10.5px}

  .feed .dh{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:8px 2px 3px}
  .feed .ev{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:baseline;padding:3px 2px;font-size:12.5px}
  .feed .ev .b{font-family:var(--mono);color:var(--ink2)}
  .arrow{color:var(--ink3)}

   
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:grid;place-items:center}
  .scrim[hidden]{display:none}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);width:min(660px,94vw)}
  .modal h3{margin:0 0 11px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
  .presets button{font-size:12px;border-radius:20px;padding:4px 11px}
  .cals{display:flex;gap:16px;flex-wrap:wrap}
  .cal{flex:1 1 270px}
  .cal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:600;font-size:12.5px}
  .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .grid7 .dow{font-size:9.5px;color:var(--ink3);text-align:center;padding:2px 0;text-transform:uppercase}
  .day{aspect-ratio:1;border:0;background:none;border-radius:6px;font:inherit;font-size:12px;
    color:var(--ink);cursor:pointer;font-family:var(--mono);padding:0}
  .day:hover{background:var(--panel2)}
  .day.in{background:color-mix(in srgb,var(--accent) 20%,transparent)}
  .day.edge{background:var(--accent);color:var(--accent-ink);font-weight:700}
  .day.future{opacity:.22;cursor:not-allowed}
  .modal .foot{display:flex;gap:8px;align-items:center;margin-top:13px;padding-top:11px;border-top:1px solid var(--soft)}
  .pop{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:7px;min-width:230px;max-height:70vh;overflow:auto;box-shadow:0 12px 34px rgba(0,0,0,.4)}
  .pop .row{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:5px;font-size:12.5px;cursor:pointer}
  .pop .row:hover{background:var(--panel2)}
  .pop .grp{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);
    padding:8px 7px 3px;border-top:1px solid var(--soft);margin-top:4px}
  .pop .grp:first-child{border-top:0;margin-top:0}
  .pop .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
  footer{max-width:1600px;margin:0 auto;padding:6px 16px 40px;color:var(--ink3);font-size:11.5px;line-height:1.65}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>Ovia OS</h1>
  <div id="tabs"></div>
  <button id="dateBtn" class="go">Last 7 days</button>
  <span class="sub" id="rangeLab"></span>
  <button id="filtBtn">Filter</button>
  <span class="grow"></span>
  <span class="sub" id="fresh"></span>
  <button id="cardsBtn">Cards</button>
  <button id="update">Update now</button>
  <button id="export">Export</button>
</header>
<div id="filterbar"></div>
<main><div id="grid"></div></main>
<footer id="prov"></footer>

<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-label="Date range">
    <h3 id="calTitle">Date range</h3>
    <div class="presets" id="presets"></div>
    <div class="cals" id="cals"></div>
    <div class="foot"><span class="sub" id="pickLab"></span><span class="grow"></span>
      <button id="cancel">Cancel</button><button class="go" id="apply">Apply</button></div>
  </div>
</div>

<script>
"use strict";





const BOOT = (function(){
  var s = "__OS_DATA__";
  return s.charAt(0) === "{" ? JSON.parse(s) : null;   
})();

 
(function(){
  var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>"
    + "<rect width='64' height='64' rx='14' fill='#0b0e13'/>"
    + "<rect x='11' y='36' width='9' height='16' rx='2.5' fill='#3ddc97' opacity='.55'/>"
    + "<rect x='27.5' y='27' width='9' height='25' rx='2.5' fill='#3ddc97' opacity='.78'/>"
    + "<rect x='44' y='17' width='9' height='35' rx='2.5' fill='#3ddc97'/>"
    + "<polyline points='13,30 26,22 34,26 51,10' fill='none' stroke='#e6ebf2'"
    + " stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/>"
    + "<circle cx='51' cy='10' r='4.4' fill='#e6ebf2'/></svg>";
  var el = document.getElementById("favicon");
  if (el) el.href = "data:image/svg+xml," + encodeURIComponent(svg);
})();



const SE={"Writing Copy":"📝","Ready To Be Edited":"⚠️","In Progress":"🎥","Pending Review":"⏱️",
  "In Revisions":"🚨","Ready For Launch":"✅","Launched":"🚀",
  "Briefing":"✉️","Not Started":"◦","Ready To Edit":"🎬"};
const STAGE=["Writing Copy","Ready To Be Edited","In Progress","Pending Review",
  "In Revisions","Ready For Launch","Launched"];
const em=st=>st?((SE[st]||"")+" "+st).trim():"—";
const nameOf=x=>x||"—";

let DATA=null,ROWS=[],EVENTS=[],SPEND=[],KEYS={},STATS={},PEOPLE=[];
let DATA_DAY="",COMPLETE="";        



const iso=d=>d.toISOString().slice(0,10);
function localToday(){const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
let TODAY=localToday();
const addD=(s,n)=>iso(new Date(new Date(s+"T12:00:00Z").getTime()+n*864e5));
const dBetween=(a,b)=>Math.round((new Date(b+"T12:00:00Z")-new Date(a+"T12:00:00Z"))/864e5);
const dow=s=>(new Date(s+"T12:00:00Z").getUTCDay()+6)%7;          
const weekStart=s=>addD(s,-dow(s));
const md=s=>new Date(s+"T12:00:00Z").toLocaleDateString("en",{month:"short",day:"numeric",timeZone:"UTC"});
const dowName=s=>new Date(s+"T12:00:00Z").toLocaleDateString("en",{weekday:"short",timeZone:"UTC"});
const monLab=s=>new Date(s+"-01T12:00:00Z").toLocaleDateString("en",{month:"short",year:"numeric",timeZone:"UTC"});
function wkLab(s){const e=addD(s,6);
  return md(s)+"–"+(s.slice(0,7)===e.slice(0,7)?e.slice(8).replace(/^0/,""):md(e));}
const bucketOf=(d,mode)=>mode==="day"?d:mode==="week"?weekStart(d):d.slice(0,7);
const bucketLab=(b,mode)=>mode==="day"?dowName(b)+" "+md(b):mode==="week"?wkLab(b):monLab(b);
function buckets(mode){
  const out=[];
  if(mode==="day"){for(let d=RANGE.from;d<=RANGE.to;d=addD(d,1))out.push(d);}
  else if(mode==="week"){for(let d=weekStart(RANGE.from);d<=RANGE.to;d=addD(d,7))out.push(d);}
  else{let d=RANGE.from.slice(0,7);const end=RANGE.to.slice(0,7);
    while(d<=end){out.push(d);const y=+d.slice(0,4),m=+d.slice(5);
      d=m===12?(y+1)+"-01":y+"-"+String(m+1).padStart(2,"0");}}
  return out;
}

let RANGE={from:"",to:""}, LABEL="Last 7 days";
let FILTERS=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd=n=>"$"+Math.round(n).toLocaleString();
const usd1=n=>n>=10000?"$"+Math.round(n/1000)+"k":"$"+Math.round(n).toLocaleString();
const initials=n=>!n?"—":n.split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const clip=(s,n)=>!s?"":(s.length>n?s.slice(0,n-1)+"…":s);



const keyMeta=k=>KEYS[k]||{kind:"other",label:k,s:null,e:null,n:null};
function inRange(d){return d>=RANGE.from&&d<=RANGE.to;}
function spendInRange(){return SPEND.filter(r=>inRange(r.d));}



function spendByRole(role,rowSet){
  const ok=rowSet?new Set(rowSet.map(r=>r.n)):null;
  const by={};
  spendInRange().forEach(r=>{
    const m=keyMeta(r.k),who=role==="s"?m.s:m.e;
    if(!who)return;                       
    if(ok&&(m.n==null||!ok.has(m.n)))return;   
    const o=by[who]=by[who]||{spend:0,purch:0,value:0,n:new Set(),keys:{}};
    o.spend+=r.s;o.purch+=r.p;o.value+=r.v;if(m.n!=null)o.n.add(m.n);
    const kk=o.keys[r.k]=o.keys[r.k]||{spend:0,purch:0,value:0,label:m.label,n:m.n};
    kk.spend+=r.s;kk.purch+=r.p;kk.value+=r.v;
  });
  return by;
}



function spendSplit(){
  const t={acct:0,owned:0,content:0,orphan:0,other:0,purch:0,value:0};
  spendInRange().forEach(r=>{
    const m=keyMeta(r.k);t.acct+=r.s;t.purch+=r.p;t.value+=r.v;
    if(m.kind==="cb")t.content+=r.s;
    else if(m.kind==="orphan")t.orphan+=r.s;
    else if(m.kind==="batch"||m.kind==="override")t.owned+=r.s;
    else t.other+=r.s;
  });
  return t;
}
 
let SPB={};
function spendPerBatch(){
  const m={};
  spendInRange().forEach(r=>{const km=keyMeta(r.k);if(km.n==null)return;
    const o=m[km.n]=m[km.n]||{s:0,p:0,v:0};o.s+=r.s;o.p+=r.p;o.v+=r.v;});
  return m;
}

];
const dimOf=k=>DIMS.find(d=>d.k===k);



function rowsFor(exclude){
  const by={};
  FILTERS.forEach(f=>{ if(f.dim===exclude)return; (by[f.dim]=by[f.dim]||[]).push(f.val); });
  const groups=Object.entries(by);
  if(!groups.length) return ROWS;
  return ROWS.filter(r=>groups.every(([dim,vals])=>{
    const d=dimOf(dim);
    if(d.multi) return d.multi(r).some(v=>vals.includes(v));   
    return vals.includes(d.get(r));
  }));
}
 
function countsFor(d,rs){
  const c={};
  rs.forEach(r=>{
    if(d.multi){ d.multi(r).forEach(v=>{ if(v!=null) c[v]=(c[v]||0)+1; }); return; }
    const v=d.get(r); if(v!=null) c[v]=(c[v]||0)+1;
  });
  return c;
}
const rows=()=>rowsFor(null);
const has=(dim,val)=>FILTERS.some(f=>f.dim===dim&&f.val===val);
function toggle(dim,val){
  const i=FILTERS.findIndex(f=>f.dim===dim&&f.val===val);
  if(i>=0) FILTERS.splice(i,1); else FILTERS.push({dim,val});
  draw();
}





const ALLTIME={key:"all",from:"1970-01-01",to:"",label:"All time"};



const BASES={added:"Added to the sheet in the window",
             launched:"Launched in the window",
             all:"Every batch, ignoring dates"};
let AWIN={};                       
function winFor(id){
  if(!AWIN[id]) AWIN[id]={...ALLTIME,to:TODAY,basis:defaultBasis(id)};
  if(!AWIN[id].basis) AWIN[id].basis=defaultBasis(id);
  return AWIN[id];
}
function defaultBasis(id){
  const spec=MIX[String(id).slice(4)];
  return (spec&&spec.basis) || "launched";
}
function analysisRows(id){
  const rs=rows(), w=winFor(id);
  if(w.basis==="all") return rs;
  if(w.basis==="added")
    return rs.filter(r=>r.created && r.created>=w.from && r.created<=w.to);
  return launchesBetween(rs,w.from,w.to).map(x=>x.r);
}
 
function launchesBetween(rowSet,from,to){
  const ev={};
  EVENTS.forEach(e=>{ if(e.to!=="Launched"||e.d<from||e.d>to)return;
    if(ev[e.n]==null||e.d<ev[e.n]) ev[e.n]=e.d; });
  const out=[];
  rowSet.forEach(r=>{
    const d=ev[r.n]||((r.launched&&r.launched>=from&&r.launched<=to)?r.launched:null);
    if(d) out.push({r,d});
  });
  return out;
}
const aLabel=id=>{
  const w=winFor(id);
  if(w.basis==="all") return "every batch, ignoring dates";
  const verb=w.basis==="added"?"added":"launched";
  return w.key==="all" ? "every batch ever "+verb
                       : verb+" "+md(w.from)+" → "+md(w.to);
};



function launchesInRange(rowSet){
  const ev={};
  EVENTS.forEach(e=>{ if(e.to!=="Launched"||!inRange(e.d))return;
    if(ev[e.n]==null||e.d<ev[e.n]) ev[e.n]=e.d; });
  const out=[];
  rowSet.forEach(r=>{
    const d=ev[r.n]||((r.launched&&inRange(r.launched))?r.launched:null);
    if(d) out.push({r,d});
  });
  return out;
}
const launchedInRange=rowSet=>launchesInRange(rowSet).map(x=>x.r);

let LAYOUT={};
function loadLayout(){
  try{LAYOUT=JSON.parse(localStorage.getItem("os.layout")||"{}")||{};}catch(e){LAYOUT={};}
  try{const t=localStorage.getItem("os.tab"); if(t&&tabOf(t))TAB=t;}catch(e){}
}
function saveLayout(){
  try{localStorage.setItem("os.layout",JSON.stringify(LAYOUT));localStorage.setItem("os.tab",TAB);}catch(e){}
}
function lay(){return LAYOUT[TAB]=LAYOUT[TAB]||{hidden:[],order:null};}
function cardOrder(){
  const L=lay(), all=tabOf(TAB).cards;
  const o=(L.order||all).filter(id=>all.indexOf(id)>=0);
  all.forEach(id=>{if(o.indexOf(id)<0)o.push(id);});
  return o;
}
const isHidden=id=>lay().hidden.indexOf(id)>=0;

  SPB=spendPerBatch();
  $("#rangeLab").innerHTML = (RANGE.from===RANGE.to ? md(RANGE.from)
      : md(RANGE.from)+" → "+md(RANGE.to)+"  ·  "+(dBetween(RANGE.from,RANGE.to)+1)+"d")

      <h3>${esc(c.t)}${sc}</h3><div class="sub"></div><div class="body"></div>`;

    +(s.storiesTotal?` · history complete for ${s.storiesFresh}/${s.storiesTotal} batches`
        +(s.storiesMissing?` (${s.storiesMissing} never fetched — the hourly story job is still filling in)`:""):"")
    +(s.unmatchedSpend?` · ${usd(s.unmatchedSpend)} of spend matched no batch or content batch`:"");
  saveLayout();
