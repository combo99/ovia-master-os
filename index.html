function drawFresh(){
  if(!DATA){$("#fresh").textContent="";return;}
  const pulled=DATA.generated?DATA.generated.slice(0,16).replace("T"," "):"?";
  const behind=dBetween(COMPLETE,TODAY);            // 1 = normal, >1 = the pull is late
  const late=behind>1;
  $("#fresh").innerHTML=`<span class="${late?"stale":""}">Data through ${md(COMPLETE)}</span>`
    +` · pulled ${pulled} ET${DATA.mode==="fast"?" (fast)":""}`
    +(late?` · <b class="stale">${behind-1}d behind</b>`:"");
  $("#fresh").title=`Today is ${TODAY} on this machine. The pull last ran ${DATA.today}, so the last `
    +`fully closed day of Meta data is ${COMPLETE}. "Last N days" ends yesterday, matching Meta's own preset.`;
}

function drawTabs(){
  $("#tabs").innerHTML=TABS.map(t=>`<button data-tab="${t.id}"${TAB===t.id?' class="on"':""}>${esc(t.t)}</button>`).join("");
}

function drawFilters(){
  const el=$("#filterbar");
  if(!FILTERS.length){ el.innerHTML=`<span class="sub">No filters — click any bar or row to start, or use Filter. Several in one dimension combine as OR; across dimensions as AND.</span>`; return; }
  const by={}; FILTERS.forEach(f=>(by[f.dim]=by[f.dim]||[]).push(f.val));
  el.innerHTML=Object.entries(by).map(([dim,vals])=>
    `<span class="fchip"><b>${esc(dimOf(dim).t)}</b>`+
    vals.map(v=>`${esc(v)}<span class="x" data-rm="${esc(dim)}|${esc(v)}">✕</span>`).join(`<span class="or">or</span>`)+
    `</span>`).join("")+`<button id="clearAll">Clear all</button>`;
}

function barCard(body,d,sub){
  const rs=rowsFor(d.k), counts=countsFor(d,rs);
  let ent=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(d.order) ent.sort((a,b)=>d.order.indexOf(a[0])-d.order.indexOf(b[0]));
  if(!ent.length){ body.innerHTML=`<div class="empty">No values</div>`; return; }
  const max=ent[0][1], tot=rs.length;
  if(sub) sub.innerHTML=`<b style="color:var(--ink);font-family:var(--mono);font-size:15px">${rs.length}</b> batches · ${ent.length} values`;
  body.className="body bars";
  body.innerHTML=ent.map(([k,c])=>`<div class="bar-row${has(d.k,k)?" active":""}" data-dim="${esc(d.k)}" data-val="${esc(k)}">
     <div class="track"><div class="fill" style="width:${100*c/max}%"></div></div>
     <span class="label" title="${esc(k)}">${esc(k)}</span>
     <span class="count">${c} · ${Math.round(100*c/tot)}%</span></div>`).join("");
}

/* ---------------- at a glance ----------------
   Rewritten to lead with the PERIOD. Leo: "I don't like how it's aggregating all
   177 batches, that's pretty useless — it should only name the number of batches
   we have launched in this period." The lifetime batch count is gone from the
   tiles; it survives only in the footer, where it belongs. */
function kpiCard(body,sub){
  const t=spendSplit(), rs=rows();
  const launched=launchedInRange(rs);
  const live=rs.filter(r=>r.st!=="Launched");
  const overdue=live.filter(r=>r.due&&r.due<TODAY).length;
  const mine=spendByRole("s",rs), team=Object.values(mine).reduce((a,o)=>a+o.spend,0);
  const scored=launched.filter(r=>r.res), winners=scored.filter(r=>r.res!=="Losing Ad").length;
  const days=dBetween(RANGE.from,RANGE.to)+1;
  body.className="body kpis";
  body.innerHTML=[
   ["Launched",launched.length,"in this period",1],
   ["Account spend",usd(t.acct),days+" days, all ads"],
   ["Batch spend",usd(team),FILTERS.length?"matching batches":"attributable to a strategist"],
   ["Purchases",t.purch.toLocaleString(),"account"],
   ["CPA",t.purch?"$"+(t.acct/t.purch).toFixed(2):"—","account"],
   ["ROAS",t.acct?(t.value/t.acct).toFixed(2):"—","account"],
   ["Hit rate",scored.length?(winners/scored.length*100).toFixed(1)+"%":"—",
      scored.length?winners+"/"+scored.length+" scored":"none scored yet"],
   ["Content",t.acct?(t.content/t.acct*100).toFixed(1)+"%":"—","unowned"],
   ["In flight",live.length,"right now"],
   ["Overdue",overdue,overdue?"past due, not launched":"nothing past due"]
  ].map(([k,v,d,lead])=>`<div class="kpi${lead?" lead":""}"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join("");
  sub.innerHTML=`<b style="color:var(--ink);font-family:var(--mono);font-size:15px">${launched.length}</b>`
    +` launched ${md(RANGE.from)} → ${md(RANGE.to)} · ${live.length} in flight now`
    +(FILTERS.length?` · filtered to ${rs.length} batches`:"");
}

/* ---------------- spend, expandable ----------------
   The chevron opens the batches behind a person's number; the NAME still
   filters. Two targets in one cell, so both gestures stay available. */
function spendCard(body,role,sub){
  /* One role per call. The strategist table and the editor table are built from
     the same spend rows by two different joins and must never be added
     together — a person appears in both with different numbers and that is
     correct, not a duplicate. */
  const by=spendByRole(role,rows());
  const list=Object.entries(by).sort((a,b)=>b[1].spend-a[1].spend);
  const tot=list.reduce((a,[,o])=>a+o.spend,0);
  const det=(who,o)=>{
    const ks=Object.entries(o.keys).sort((a,b)=>b[1].spend-a[1].spend);
    const top=ks.slice(0,12), rest=ks.slice(12);
    const restSpend=rest.reduce((a,[,k])=>a+k.spend,0);
    return `<tr class="det"><td colspan="7"><table><thead><tr>
        <th>Batch</th><th>Spend</th><th>Share</th><th>Purch</th><th>CPA</th><th>ROAS</th></tr></thead><tbody>`
      +top.map(([kk,k])=>{const b=k.n!=null?ROWS.find(x=>x.n===k.n):null;
        return `<tr><td class="txt name">${b&&b.url
            ?`<a class="q" href="${esc(b.url)}" target="_blank" rel="noopener">${esc(k.label)}</a>`
            :esc(k.label)}</td>
          <td>${usd(k.spend)}</td><td>${o.spend?(k.spend/o.spend*100).toFixed(1):"0.0"}%</td>
          <td>${k.purch}</td><td>${k.purch?"$"+(k.spend/k.purch).toFixed(2):"—"}</td>
          <td>${k.spend?(k.value/k.spend).toFixed(2):"—"}</td></tr>`;}).join("")
      +(rest.length?`<tr><td class="txt" style="color:var(--ink3)">and ${rest.length} more batches</td>
          <td>${usd(restSpend)}</td><td>${o.spend?(restSpend/o.spend*100).toFixed(1):"0.0"}%</td>
          <td colspan="3"></td></tr>`:"")
      +`</tbody></table></td></tr>`;
  };
  body.innerHTML=`<div class="tw"><table><thead><tr><th>Person</th><th>Spend</th><th>Share</th>
      <th>Batches</th><th>Purch</th><th>CPA</th><th>ROAS</th></tr></thead><tbody>`
   +(list.length?list.map(([w,o])=>{const open=V.expand.has(role+"|"+w);
      return `<tr>
      <td class="txt"><span class="exp${open?" open":""}" data-exp="${esc(role+"|"+w)}" title="Show this person's batches">▸</span>
        <span class="q" style="cursor:pointer" data-dim="${role}" data-val="${esc(w)}">${esc(w)}</span></td>
      <td>${usd(o.spend)}</td>
      <td>${tot?(o.spend/tot*100).toFixed(1):"0.0"}%</td><td>${o.n.size}</td><td>${o.purch}</td>
      <td>${o.purch?"$"+(o.spend/o.purch).toFixed(2):"—"}</td>
      <td>${o.spend?(o.value/o.spend).toFixed(2):"—"}</td></tr>`
      +(open?det(w,o):"");}).join("")
     :`<tr><td colspan="7" class="empty">No spend for these filters in this range.</td></tr>`)
   +`<tr class="tot"><td class="txt">All ${role==="s"?"strategists":"editors"}</td><td>${usd(tot)}</td><td>100%</td>
      <td></td><td>${list.reduce((a,[,o])=>a+o.purch,0)}</td><td></td><td></td></tr></tbody></table></div>`;
  const t=spendSplit();
  body.insertAdjacentHTML("beforeend",
    `<div class="recon"><span>Account <b>${usd(t.acct)}</b></span>
      <span>This role <b>${usd(tot)}</b> (${t.acct?(tot/t.acct*100).toFixed(1):"0.0"}%)</span>
      <span>Content, unowned <b>${usd(t.content)}</b> (${t.acct?(t.content/t.acct*100).toFixed(1):"0.0"}%)</span>
      ${t.orphan?`<span>Not in Asana <b>${usd(t.orphan)}</b></span>`:""}
      ${t.other?`<span>Unclassified <b>${usd(t.other)}</b></span>`:""}</div>`);
  if(sub) sub.innerHTML=`<b style="color:var(--ink);font-family:var(--mono);font-size:15px">${usd(tot)}</b>`
    +` on batches owned by ${role==="s"?"a strategist":"an editor"}`
    +(FILTERS.length?" · filtered":"")
    +` · <b style="color:var(--accent)">▸</b> opens their top batches · click a name to filter`
    +` · content batches have no owner, so this never equals account spend`;
}

/* ---------------- launched, with a granularity switch ----------------
   Leo: "should have different views automatically like weekly view so I can see
   when certain things were launched/ideated. It should just be a button click."
   Two switches: what the rows are, and how wide a column is. */
function launchCard(body,sub){
  const L=launchesInRange(rows());
  const gran=V.launch.gran, split=V.launch.split;
  const ctl=`<div class="ctl"><span class="lab">View</span>`
   +[["total","Totals"],["week","By week"],["month","By month"],["day","By day"]]
     .map(([k,l])=>`<button class="sm${gran===k?" go":""}" data-lg="${k}">${l}</button>`).join("")
   +`<span style="width:10px"></span><span class="lab">Rows</span>`
   +[["person","Person"],["bt","Brief type"],["fm","Format"],["st","Status"]]
     .map(([k,l])=>`<button class="sm${split===k?" go":""}" data-ls="${k}">${l}</button>`).join("")
   +`</div>`;

  if(!L.length){body.innerHTML=ctl+`<div class="empty">Nothing launched in this range with the current filters.</div>`;
    sub.textContent="0 launches in range";return;}

  /* Totals keeps the shape Leo signed off on: per person, split by the brief
     type they came in as, with the role roll-up on the bottom line. */
  if(gran==="total"&&split==="person"){
    const mk=(roleKey,label)=>{
      /* BRIEF TYPE ARRIVES LOWERCASE — 'ideation', not 'Ideation'. Keying this
         table on the capitalised words silently renders three columns of zeros,
         which is exactly what it did until it was caught in test. */
      /* A launched batch with nobody in this role is shown as (unassigned)
         rather than dropped, so the bottom line equals the number of launches
         on the At a glance tile. A silent drop is how a table ends up
         disagreeing with the headline it sits under. */
      const by={};
      L.forEach(({r})=>{const w=r[roleKey]||"(unassigned)";
        const o=by[w]=by[w]||{ideation:0,iteration:0,imitation:0,n:0};
        const bt=(r.bt||"").toLowerCase();
        if(o[bt]!==undefined)o[bt]++; o.n++;});
      const list=Object.entries(by).sort((a,b)=>b[1].n-a[1].n);
      const t={ideation:0,iteration:0,imitation:0,n:0};
      list.forEach(([,o])=>["ideation","iteration","imitation","n"].forEach(k=>t[k]+=o[k]));
      return `<table><thead><tr><th>${label}</th><th>💡 Ideation</th><th>🔄 Iteration</th><th>🎭 Imitation</th><th>Total</th></tr></thead><tbody>`
        +list.map(([w,o])=>`<tr class="click" data-dim="${roleKey}" data-val="${esc(w)}">
           <td class="txt">${esc(w)}</td><td>${o.ideation||"·"}</td><td>${o.iteration||"·"}</td>
           <td>${o.imitation||"·"}</td><td><b>${o.n}</b></td></tr>`).join("")
        +`<tr class="tot"><td class="txt">All ${label.toLowerCase()}s</td><td>${t.ideation}</td>
           <td>${t.iteration}</td><td>${t.imitation}</td><td>${t.n}</td></tr></tbody></table>`;
    };
    body.innerHTML=ctl+`<div class="tw">${mk("s","Strategist")}<div style="height:12px"></div>${mk("e","Editor")}</div>`;
    sub.innerHTML=`<b style="color:var(--ink);font-family:var(--mono);font-size:15px">${L.length}</b>`
      +` launched ${md(RANGE.from)} → ${md(RANGE.to)} · role totals on the bottom line`;
    return;
  }
  if(gran==="total"){
    const d=dimOf(split);
    const by={}; L.forEach(({r})=>{const v=d.get(r)||"(blank)"; by[v]=(by[v]||0)+1;});
    const list=Object.entries(by).sort((a,b)=>b[1]-a[1]);
    body.innerHTML=ctl+`<div class="tw"><table><thead><tr><th>${esc(d.t)}</th><th>Launched</th><th>Share</th></tr></thead><tbody>`
      +list.map(([v,n])=>`<tr class="click" data-dim="${esc(split)}" data-val="${esc(v)}">
          <td class="txt">${esc(v)}</td><td>${n}</td><td>${(n/L.length*100).toFixed(1)}%</td></tr>`).join("")
      +`<tr class="tot"><td class="txt">All</td><td>${L.length}</td><td>100%</td></tr></tbody></table></div>`;
    sub.innerHTML=`<b style="color:var(--ink);font-family:var(--mono);font-size:15px">${L.length}</b> launched, by ${d.t.toLowerCase()}`;
    return;
  }

  /* Matrix: rows are the split, columns are time. Column header click sets the
     date range to that bucket; row name click filters on it. */
  const cols=buckets(gran);
  const matrix=(pick,label,dimKey)=>{
    const by={};
    L.forEach(({r,d})=>{
      const w=pick(r); if(w==null)return;
      const o=by[w]=by[w]||{n:0,c:{}}; const b=bucketOf(d,gran);
      o.c[b]=(o.c[b]||0)+1; o.n++;
    });
    const list=Object.entries(by).sort((a,b)=>b[1].n-a[1].n);
    if(!list.length)return "";
    const colTot={}; cols.forEach(c=>colTot[c]=0);
    list.forEach(([,o])=>cols.forEach(c=>colTot[c]+=(o.c[c]||0)));
    const grand=cols.reduce((a,c)=>a+colTot[c],0);
    const peak=Math.max(1,...list.flatMap(([,o])=>cols.map(c=>o.c[c]||0)));
    return `<table><thead><tr><th>${esc(label)}</th>`
      +cols.map(c=>`<th data-bk="${esc(c)}|${gran}" title="Set the range to ${esc(bucketLab(c,gran))}">${esc(bucketLab(c,gran))}</th>`).join("")
      +`<th>Total</th></tr></thead><tbody>`
      +list.map(([w,o])=>`<tr>
          <td class="txt${dimKey?" q":""}"${dimKey?` style="cursor:pointer" data-dim="${esc(dimKey)}" data-val="${esc(w)}"`:""}>${esc(w)}</td>`
        +cols.map(c=>{const n=o.c[c]||0;
          return `<td style="${n?`background:color-mix(in srgb,var(--accent) ${Math.round(8+42*n/peak)}%,transparent)`:""}">${n||"·"}</td>`;}).join("")
        +`<td><b>${o.n}</b></td></tr>`).join("")
      +`<tr class="tot"><td class="txt">All</td>`
      +cols.map(c=>`<td>${colTot[c]||"·"}</td>`).join("")+`<td>${grand}</td></tr></tbody></table>`;
  };
  let html;
  if(split==="person"){
    html=`<div style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:2px 0 4px">Strategist</div>`
      +matrix(r=>r.s||"(unassigned)","Strategist","s")
      +`<div style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:12px 0 4px">Editor</div>`
      +matrix(r=>r.e||"(unassigned)","Editor","e");
  }else{
    const d=dimOf(split);
    html=matrix(r=>d.get(r)||"(blank)",d.t,split);
  }
  body.innerHTML=ctl+`<div class="tw tall">${html}</div>`;
  sub.innerHTML=`<b style="color:var(--ink);font-family:var(--mono);font-size:15px">${L.length}</b>`
    +` launched across ${cols.length} ${gran==="day"?"days":gran+"s"} · click a column header to zoom the range to it`;
}

/* ---------------- kanban ----------------
   The pipeline drawn the way the team already reads it in Asana: one column per
   status, volume on the header, the batches themselves underneath. Everything
   the global filters do applies here, so picking a person leaves only their
   board. Column header toggles that status as a filter. */
/** The board itself, so the Pipeline card and the Batches card can both draw
    it from whatever row set they have already scoped. */
function renderKanban(rs,hideLaunched){
  const by={}; STAGE.forEach(s=>by[s]=[]);
  const extra=[];
  rs.forEach(r=>{ if(by[r.st])by[r.st].push(r); else extra.push(r); });
  const shown=hideLaunched?STAGE.filter(s=>s!=="Launched"):STAGE;
  const peak=Math.max(1,...shown.map(s=>by[s].length));

  const col=st=>{
    const list=by[st].slice().sort((a,b)=>(b.age==null?-1:b.age)-(a.age==null?-1:a.age));
    const spend=list.reduce((a,r)=>a+((SPB[r.n]&&SPB[r.n].s)||0),0);
    const cap=list.slice(0,40);
    return `<div class="kcol${has("st",em(st))?" on":""}">
      <div class="kh" data-dim="st" data-val="${esc(em(st))}">
        <div class="t"><span>${SE[st]||""}</span><span>${esc(st)}</span><b>${list.length}</b></div>
        <div class="m">${usd1(spend)} in range</div>
        <div class="vol"><i style="width:${100*list.length/peak}%"></i></div>
      </div>
      <div class="kbody">`
      +(list.length?cap.map(r=>{const sp=(SPB[r.n]&&SPB[r.n].s)||0;
        return `<a class="kcard" href="${esc(r.url||"#")}" target="_blank" rel="noopener">
          <div class="n">#${r.n}${(r.hist===0||r.hist===-1)?`<span title="story history not fully fetched yet — the hourly job is still filling in">&nbsp;·</span>`:""}</div>
          <div class="nm">${esc(clip(r.name,64)||"—")}</div>
          <div class="ft">
            ${r.age==null?`<span class="ring" title="no transition or snapshot yet">—</span>`
              :`<span class="ring${r.age>=4?" w":""}" title="${r.age} days in ${esc(st)}${r.sinceEst?" (inferred from snapshots)":""}">${r.age}${r.sinceEst?"*":""}</span>`}
            <span class="who" title="${esc(nameOf(r.e))}">${esc(initials(r.e))}</span>
            ${sp?`<span class="sp">${usd1(sp)}</span>`:""}
          </div></a>`;}).join("")
       :`<div class="empty" style="font-size:11.5px">—</div>`)
      +(list.length>cap.length?`<div class="sub" style="padding:4px 2px">+${list.length-cap.length} more</div>`:"")
      +`</div></div>`;
  };
  return `<div class="kan">${shown.map(col).join("")}</div>`
   +(extra.length?`<div class="sub" style="margin-top:6px">${extra.length} batch(es) sit in a status outside the standard pipeline: `
      +[...new Set(extra.map(r=>r.st||"(none)"))].map(esc).join(", ")+`</div>`:"");
}

function kanbanCard(body,sub){
  const all=rows();
  const scope=V.kan.scope;
  const rs=scope==="live"?all.filter(r=>r.st!=="Launched"):all;
  body.innerHTML=`<div class="ctl"><span class="lab">Show</span>`
   +[["live","In flight"],["all","Everything"]].map(([k,l])=>
      `<button class="sm${scope===k?" go":""}" data-kan="${k}">${l}</button>`).join("")
   +`<span class="sub" style="margin-left:8px">click a column to filter by that status · click a card to open it in Asana</span></div>`
   +renderKanban(rs,scope==="live");
  sub.innerHTML=`<b style="color:var(--ink);font-family:var(--mono);font-size:15px">${rs.length}</b>`
   +` batches on the board${FILTERS.length?" with the current filters":""}`
   +` · the ring is days in that status · the columns are a <b>now</b> snapshot,`
   +` the money on them is spend inside the selected range`;
}

/* ---------------- batches table ---------------- */
function boardCard(body,sub){
  const all=rows();
  const changed=new Set(EVENTS.filter(e=>inRange(e.d)).map(e=>e.n));
  const launched=new Set(launchedInRange(all).map(r=>r.n));
  const B=V.board;
  const rs=(B.scope==="live"?all.filter(r=>r.st!=="Launched")
           :B.scope==="changed"?all.filter(r=>changed.has(r.n))
           :B.scope==="launched"?all.filter(r=>launched.has(r.n))
           :all).slice();
  const SORT=V.sort;
  rs.sort((a,b)=>{let x=a[SORT.k],y=b[SORT.k];
    if(SORT.k==="spend"){x=(SPB[a.n]&&SPB[a.n].s)||0;y=(SPB[b.n]&&SPB[b.n].s)||0;}
    if(x==null)x=SORT.dir<0?-Infinity:Infinity; if(y==null)y=SORT.dir<0?-Infinity:Infinity;
    return (x>y?1:x<y?-1:0)*SORT.dir;});

  const cols=[["n","Batch"],["st","Status"],["age","Days"],["e","Editor"],["s","Strategist"],
    ["bt","Type"],["fm","Format"],["res","Result"],["spend","Spend"],["due","Due"]];
  const groupers={none:null,
    st:{t:"Status",of:r=>em(r.st),order:STAGE.map(em)},
    e:{t:"Editor",of:r=>nameOf(r.e)},
    s:{t:"Strategist",of:r=>nameOf(r.s)},
    wk:{t:"Week launched",of:r=>r.launched?weekStart(r.launched):"not launched"}};
  const ctl=`<div class="ctl"><span class="lab">View</span>`
   +[["table","Table"],["kanban","Kanban"]].map(([k,l])=>
      `<button class="sm${B.view===k?" go":""}" data-bview="${k}">${l}</button>`).join("")
   +`<span style="width:10px"></span><span class="lab">Show</span>`
   +[["live","In flight"],["changed","Changed in range"],["launched","Launched in range"],["all","All"]]
     .map(([k,l])=>`<button class="sm${B.scope===k?" go":""}" data-board="${k}">${l}</button>`).join("")
   +(B.view==="table"?`<span style="width:10px"></span><span class="lab">Group</span>`
     +[["none","None"],["st","Status"],["e","Editor"],["s","Strategist"],["wk","Week launched"]]
       .map(([k,l])=>`<button class="sm${B.group===k?" go":""}" data-bgrp="${k}">${l}</button>`).join("")
     :"")
   +`</div>`;

  /* The same board Leo signed off on in Outcomes, driven by whichever scope
     this card is set to — so "Launched in range" as a kanban is one click. */
  if(B.view==="kanban"){
    body.innerHTML=ctl+renderKanban(rs,B.scope==="live");
    sub.innerHTML=rs.length+" of "+ROWS.length+" batches · click a column to filter by that status · "
     +"click a card to open it in Asana · <b>days</b> and <b>status</b> are NOW figures";
    return;
  }

  const line=r=>{const sp=(SPB[r.n]&&SPB[r.n].s)||0;
    return `<tr>
      <td class="txt name"><a class="q" href="${esc(r.url||"#")}" target="_blank" rel="noopener">#${r.n} ${esc(r.name)}</a></td>
      <td class="txt"><span class="pill">${esc(em(r.st))}</span></td>
      <td>${r.st==="Launched"?"—":r.age==null?`<span class="sub" title="no transition or snapshot yet">—</span>`
          :`<span class="ring${r.age>=4?" w":""}"${r.sinceEst?' title="inferred from daily snapshots, not a transition"':""}>${r.age}${r.sinceEst?"*":""}</span>`}</td>
      <td class="txt">${esc(nameOf(r.e))}</td><td class="txt" style="color:var(--ink2)">${esc(nameOf(r.s))}</td>
      <td class="txt">${esc(r.bt||"·")}</td><td class="txt">${esc(r.fm||"·")}</td>
      <td class="txt">${r.res?esc(r.res):"·"}</td>
      <td>${sp?usd(sp):"·"}</td>
      <td class="txt" style="color:${r.due&&r.due<TODAY&&r.st!=="Launched"?"var(--hot)":"var(--ink3)"}">${r.due||"—"}</td>
     </tr>`;};

  let bodyRows;
  if(!rs.length) bodyRows=`<tr><td colspan="${cols.length}" class="empty">Nothing matches.</td></tr>`;
  else if(B.group==="none") bodyRows=rs.map(line).join("");
  else{
    const g=groupers[B.group], by={};
    rs.forEach(r=>{const v=g.of(r);(by[v]=by[v]||[]).push(r);});
    let ks=Object.keys(by);
    if(g.order) ks.sort((a,b)=>g.order.indexOf(a)-g.order.indexOf(b));
    else if(B.group==="wk") ks.sort((a,b)=>a<b?1:-1);
    else ks.sort((a,b)=>by[b].length-by[a].length);
    bodyRows=ks.map(k=>{
      const list=by[k], sp=list.reduce((a,r)=>a+((SPB[r.n]&&SPB[r.n].s)||0),0);
      const lab=B.group==="wk"&&k!=="not launched"?"Week of "+wkLab(k):k;
      return `<tr class="grp"><td colspan="${cols.length}">${esc(lab)} · ${list.length} batch${list.length===1?"":"es"}`
        +(sp?` · ${usd(sp)} in range`:"")+`</td></tr>`+list.map(line).join("");
    }).join("");
  }
  body.innerHTML=ctl+`<div class="tw tall"><table><thead><tr>`
   +cols.map(([k,l])=>`<th data-sort="${k}">${l}${V.sort.k===k?(V.sort.dir<0?" ▾":" ▴"):""}</th>`).join("")
   +`</tr></thead><tbody>${bodyRows}</tbody></table></div>`;
  sub.innerHTML=rs.length+" of "+ROWS.length+" batches · click a batch to open it in Asana · "
   +"click a header to sort · <b>days</b> and <b>status</b> are NOW figures; <b>spend</b> is range-scoped"
   +(rs.some(r=>r.sinceEst&&r.st!=="Launched")?" · * inferred from snapshots":"");
}

/* ---------------- what changed ----------------
   Leo: "needs much more context by day and I should be able to put it into a
   weekly view like Asana has. There should be clear columns for the batch
   number, the concept, the editor, the strategist." So: three views, and the
   two table views carry those columns explicitly. The calendar stays because it
   is the only one that shows the SHAPE of a month at a glance. */
function feedCard(body,sub){
  const ok=new Set(rows().map(r=>r.n));
  const evs=EVENTS.filter(e=>ok.has(e.n));
  const inR=evs.filter(e=>inRange(e.d));
  const ctl=`<div class="ctl"><span class="lab">View</span>`
   +[["week","By week"],["day","By day"],["cal","Calendar"]].map(([k,l])=>
      `<button class="sm${V.feed===k?" go":""}" data-feed="${k}">${l}</button>`).join("")
   +`</div>`;
  sub.innerHTML=`<b style="color:var(--ink);font-family:var(--mono);font-size:15px">${inR.length}</b>`
    +` changes ${md(RANGE.from)} → ${md(RANGE.to)}`
    +(FILTERS.length?` on the ${ok.size} batches matching the filters`:"");

  if(V.feed==="cal"){ body.innerHTML=ctl; calFeed(body,evs,inR.length); return; }

  const rowFor=(e,withDay)=>{
    const b=ROWS.find(x=>x.n===e.n);
    const t=e.at?new Date(e.at).toLocaleTimeString("en",{hour:"numeric",minute:"2-digit"}):"";
    return `<tr>`
      +(withDay?`<td class="txt" style="color:var(--ink3)">${dowName(e.d)} ${md(e.d)}</td>`:"")
      +`<td>${b&&b.url?`<a class="q" href="${esc(b.url)}" target="_blank" rel="noopener">#${e.n}</a>`:"#"+e.n}</td>
      <td class="txt name">${esc(clip(b?b.name:"",56)||"—")}</td>
      <td class="txt">${e.from?`<span style="color:var(--ink3)">${esc(em(e.from))}</span> <span class="arrow">→</span> `:""}<b>${esc(em(e.to))}</b></td>
      <td class="txt">${esc(nameOf(b&&b.e))}</td>
      <td class="txt" style="color:var(--ink2)">${esc(nameOf(b&&b.s))}</td>
      <td class="txt" style="color:var(--ink3)">${e.by?esc(e.by):"Asana rule"}</td>
      <td style="color:var(--ink3)">${t}</td></tr>`;
  };
  const head=withDay=>`<tr>${withDay?"<th>Day</th>":""}<th>Batch</th><th>Concept</th>
    <th>Change</th><th>Editor</th><th>Strategist</th><th>By</th><th>Time</th></tr>`;

  if(!inR.length){ body.innerHTML=ctl+`<div class="empty">No changes in this range with the current filters.</div>`; return; }

  if(V.feed==="day"){
    const by={}; inR.forEach(e=>(by[e.d]=by[e.d]||[]).push(e));
    const days=Object.keys(by).sort().reverse();
    body.innerHTML=ctl+`<div class="tw tall"><table><thead>${head(false)}</thead><tbody>`
      +days.map(d=>`<tr class="grp"><td colspan="7">${dowName(d)} ${md(d)} · ${by[d].length} change${by[d].length===1?"":"s"}
          · ${new Set(by[d].map(e=>e.n)).size} batch${new Set(by[d].map(e=>e.n)).size===1?"":"es"}</td></tr>`
        +by[d].slice().sort((a,b)=>a.at<b.at?-1:1).map(e=>rowFor(e,false)).join("")).join("")
      +`</tbody></table></div>`;
    return;
  }
  /* weekly, the Asana-style grouping he asked for */
  const by={}; inR.forEach(e=>{const w=weekStart(e.d);(by[w]=by[w]||[]).push(e);});
  const wks=Object.keys(by).sort().reverse();
  body.innerHTML=ctl+`<div class="tw tall"><table><thead>${head(true)}</thead><tbody>`
    +wks.map(w=>{const list=by[w].slice().sort((a,b)=>a.at<b.at?-1:1);
      const launches=list.filter(e=>e.to==="Launched").length;
      return `<tr class="grp"><td colspan="8">Week of ${wkLab(w)} · ${list.length} change${list.length===1?"":"s"}
        · ${new Set(list.map(e=>e.n)).size} batches${launches?` · <span style="color:var(--accent)">${launches} launched 🚀</span>`:""}</td></tr>`
      +list.map(e=>rowFor(e,true)).join("");}).join("")
    +`</tbody></table></div>`;
}

function calFeed(body,evs,inR){
  /* Leo: "why is it not a calendar? It's really difficult to view this as just
     text." A month grid of transition counts — the shape of the month is
     visible before any reading happens. Click a day for its events. */
  const byDay={}; evs.forEach(e=>(byDay[e.d]=byDay[e.d]||[]).push(e));
  const m=new Date(RANGE.to+"T12:00:00Z"), y=m.getUTCFullYear(), mo=m.getUTCMonth();
  const start=(new Date(Date.UTC(y,mo,1)).getUTCDay()+6)%7, dim=new Date(Date.UTC(y,mo+1,0)).getUTCDate();
  let cells="";
  for(let i=0;i<start;i++) cells+=`<div class="cell blank"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const list=byDay[ds]||[], n=list.length, lit=inRange(ds);
    const bg=n?`background:color-mix(in srgb,var(--accent) ${Math.min(10+n*11,58)}%,var(--panel2))`:"";
    const emo=[...new Set(list.map(e=>SE[e.to]||""))].join("");
    cells+=`<div class="cell${V.calSel===ds?" sel":""}${ds===TODAY?" today":""}" data-cal="${ds}"
      style="${bg};${lit?"":"opacity:.35"}" title="${ds}: ${n} change${n===1?"":"s"}">
      <div class="dn">${d}</div>${n?`<div class="big">${n}</div><div class="em">${emo}</div>`:""}</div>`;
  }
  const sel=V.calSel&&byDay[V.calSel]?byDay[V.calSel]:null;
  body.insertAdjacentHTML("beforeend",
    `<div class="actcal">${["m","t","w","t","f","s","s"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div>`
   +(sel?`<div class="daydetail feed"><div class="dh">${new Date(V.calSel+"T12:00:00Z").toLocaleDateString("en",{weekday:"long",month:"short",day:"numeric",timeZone:"UTC"})} · ${sel.length} change${sel.length===1?"":"s"}</div>`
      +sel.map(e=>{const bb=ROWS.find(x=>x.n===e.n);
        return `<div class="ev"><span class="b">#${e.n}</span>
          <span>${e.from?esc(em(e.from))+' <span class="arrow">→</span> ':""}<b>${esc(em(e.to))}</b>
          ${bb?`<span class="sub"> ${esc(clip(bb.name,32))}</span>`:""}</span>
          <span class="sub">${e.by?esc(e.by):"Asana rule"}</span></div>`;}).join("")+`</div>`
     :`<div class="daydetail sub">Click a day for its changes. Dimmed days are outside the selected range.</div>`));
}

/* ---------------- composition ("mix") cards ----------------
   Part-to-whole, so: a horizontal stacked bar, never a pie. A 2-slice pie is
   a stat tile, and close slices are unreadable — the form was chosen against
   the data-viz form table, not by preference.

   The bar is the glance; the list under it is simultaneously the legend, the
   direct labels and the table view, which is what keeps this readable for a
   colourblind reader and in light mode where one slot sits under 3:1.

   Above ~6 classes colour stops separating them, so those dimensions (format,
   avatar) render the list alone with no bar. That is the documented ceiling,
   not an oversight. */
const pct=(n,t)=>!t?"0%":(n/t*100)<9.95?(n/t*100).toFixed(1)+"%":Math.round(n/t*100)+"%";

const MIX={
  /* basis: which date puts a batch in the window. The composition cards count
     what was ADDED, so work sitting unedited in the sheet is included; the
     result mix stays on LAUNCHED because an unlaunched ad has no result. */
  res:{t:"Result mix",  dim:"res", kind:"result", basis:"launched"},
  aw: {t:"Awareness",   dim:"aw",  basis:"added", ramp:["--awr-1","--awr-2","--awr-3","--awr-4","--awr-5"],
       order:["Unaware","Problem Aware","Solution Aware","Product Aware","Most Aware"]},
  bt: {t:"Brief type",  dim:"bt",  basis:"added", cat:["--cat-1","--cat-2","--cat-3"],
       order:["ideation","iteration","imitation"]},
  fm: {t:"Format",      dim:"fm",  basis:"added"},
  av: {t:"Avatar",      dim:"av",  basis:"added"}
};
const WINNERS=["KPI Winner","Spend Winner","Breakthrough Winner"];
/* Registered here rather than in the CARD literal because MIX is defined below
   it and a const cannot be read before its declaration. */
Object.keys(MIX).forEach(k=>CARD["mix:"+k]={t:MIX[k].t,cls:"",scope:"mix",mix:k});

/* The date chip that sits ON the card. Clicking it opens the window menu. */
function winChip(id,canChart){
  const w=winFor(id);
  return `<div class="ctl"><button class="sm chip" data-win="${esc(id)}">${esc(w.label)} ▾</button>`
    +(canChart?[["donut","◕ Donut"],["bars","▤ Bars"]].map(([k,l])=>
      `<button class="sm${V.mixView===k?" go":""}" data-mixv="${k}">${l}</button>`).join(""):"")
    +`</div>`;
}

/* ---- donut ----
   Part-to-whole at a glance, which is the one job a ring is actually good at,
   and only ever with six or fewer segments. Built as inline SVG from JS so
   HtmlService cannot escape anything on the way out (PLAN.md §19).

   The ring is NOT the label surface: the list underneath carries the exact
   percentages and doubles as the legend, so nothing here depends on telling
   two colours apart. Each arc is trimmed by a couple of degrees so adjacent
   fills never touch — the same 2px surface gap the stacked bar uses. */
function donut(segs,bigLabel,smallLabel){
  const live=segs.filter(s=>s.v>0);
  const tot=live.reduce((a,s)=>a+s.v,0);
  if(!tot) return "";
  const SZ=140, R=54, SW=20, C=2*Math.PI*R, CX=SZ/2;
  let off=0;
  const arcs=live.map(s=>{
    const len=C*s.v/tot;
    const gap=live.length>1?Math.min(3,len*0.25):0;   // never swallow a thin slice
    const dash=Math.max(len-gap,0.75);
    const a=`<circle cx="${CX}" cy="${CX}" r="${R}" fill="none" stroke="var(${s.colour})"
       stroke-width="${SW}" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}"
       stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${CX} ${CX})"
       ><title>${esc(s.label)} — ${s.v} (${pct(s.v,tot)})</title></circle>`;
    off+=len; return a;
  }).join("");
  return `<div class="donutwrap"><svg viewBox="0 0 ${SZ} ${SZ}" class="donut" role="img"
      aria-label="${esc(live.map(s=>s.label+" "+pct(s.v,tot)).join(", "))}">${arcs}</svg>
    <div class="dcen"><b>${esc(bigLabel)}</b><span>${esc(smallLabel)}</span></div></div>`;
}

function sbar(segs,cls){        // segs: [{v, colour, label}]
  const tot=segs.reduce((a,s)=>a+s.v,0);
  if(!tot) return "";
  return `<div class="sbar ${cls||""}">`+segs.filter(s=>s.v>0).map(s=>
    `<i style="flex:${s.v} 0 0;background:var(${s.colour})" title="${esc(s.label)} — ${s.v} (${pct(s.v,tot)})"></i>`
  ).join("")+`</div>`;
}

function mixCard(body,sub,key){
  const cardId="mix:"+key;
  const spec=MIX[key], d=dimOf(spec.dim), rs=analysisRows(cardId);
  const donutOn=V.mixView==="donut";

  if(spec.kind==="result"){
    /* Leo's ask, precisely: "Losing Ad %, then Winner % (KPI/Spend Winner) and
       Breakthrough % as a SUB-% of the winners." So two bars — the first over
       everything scored, the second renormalised to the winners alone. */
    const scored=rs.filter(r=>r.res);
    const lose=scored.filter(r=>r.res==="Losing Ad").length;
    const wins=WINNERS.map(w=>({w,n:scored.filter(r=>r.res===w).length}));
    const winTot=wins.reduce((a,x)=>a+x.n,0);
    const unscored=rs.length-scored.length;
    const chip=winChip(cardId,scored.length>0);
    if(!scored.length){
      body.innerHTML=chip+`<div class="empty">Nothing scored yet in this window. ${rs.length} batches, none with a result.</div>`;
      sub.innerHTML=aLabel(cardId); return;
    }
    const rowFor=(label,n,denom,colour,isSub)=>
      `<div class="mixrow${isSub?" sub":""}${has("res",label)?" active":""}"${label!=="Winners"?` data-dim="res" data-val="${esc(label)}"`:""}>
         <span class="nm"><span class="swatch" style="background:var(${colour})"></span><em>${esc(label)}</em></span>
         <span class="n">${n}</span><span class="p">${pct(n,denom)}</span></div>`;

    /* One ring of FOUR segments, not a two-slice ring of losing-vs-winners: a
       two-slice pie is a stat tile wearing a costume, and the hit rate in the
       middle already is that tile. The winners keep their own renormalised
       row set underneath, which is where "Breakthrough as a share of winners"
       actually lives. */
    const head = donutOn
      ? donut([{v:lose,colour:"--mute",label:"Losing Ad"}]
                .concat(wins.map((x,i)=>({v:x.n,colour:"--win-"+(i+1),label:x.w}))),
              pct(winTot,scored.length), "hit rate")
        +`<div class="sblab"><span>Of everything scored</span><span>${scored.length} ads</span></div>`
      : `<div class="hero"><b>${pct(winTot,scored.length)}</b><span>hit rate · ${winTot} of ${scored.length} scored ads won</span></div>`
        +`<div class="sblab"><span>Of everything scored</span><span>${scored.length} ads</span></div>`
        +sbar([{v:lose,colour:"--mute",label:"Losing Ad"},{v:winTot,colour:"--win-2",label:"Winners"}]);

    body.innerHTML=chip+head
      +rowFor("Losing Ad",lose,scored.length,"--mute")
      +rowFor("Winners",winTot,scored.length,"--win-2")
      +(winTot?`<div class="sblab" style="margin-top:9px"><span>Of the winners only</span><span>${winTot} ads</span></div>`
        +(donutOn?"":sbar(wins.map((x,i)=>({v:x.n,colour:"--win-"+(i+1),label:x.w})),"sbar2"))
        +wins.map((x,i)=>rowFor(x.w,x.n,winTot,"--win-"+(i+1),true)).join(""):"")
      +(unscored?`<div class="recon"><span>${unscored} more launched with no result recorded yet — left out of every percentage above</span></div>`:"");
    sub.innerHTML=aLabel(cardId)+(FILTERS.length?" · filtered":"");
    return;
  }

  const counts=countsFor(d,rs);
  let ent=Object.entries(counts);
  if(spec.order) ent.sort((a,b)=>spec.order.indexOf(a[0])-spec.order.indexOf(b[0]));
  else ent.sort((a,b)=>b[1]-a[1]);
  const ramp=spec.ramp||spec.cat;
  const showChart=!!ramp && ent.length>0 && ent.length<=6;
  const chip=winChip(cardId,showChart);
  if(!ent.length){ body.innerHTML=chip+`<div class="empty">No values in this window.</div>`; sub.innerHTML=aLabel(cardId); return; }
  const tot=ent.reduce((a,[,n])=>a+n,0);
  const blank=rs.length-tot;          // in the window but with this field empty
  const colourOf=i=>ramp?ramp[Math.min(i,ramp.length-1)]:"--bar";
  const segs=ent.map(([k,n],i)=>({v:n,colour:colourOf(i),label:k}));
  body.innerHTML=chip
    +(showChart
       ? (donutOn ? donut(segs,String(tot),"batches")
                  : `<div class="sblab"><span>${esc(spec.t)}</span><span>${tot} batches</span></div>`+sbar(segs))
       : "")
    +ent.map(([k,n],i)=>
      `<div class="mixrow${has(spec.dim,k)?" active":""}" data-dim="${esc(spec.dim)}" data-val="${esc(k)}">
         <span class="nm">${showChart?`<span class="swatch" style="background:var(${colourOf(i)})"></span>`:""}<em>${esc(k)}</em></span>
         <span class="n">${n}</span><span class="p">${pct(n,tot)}</span></div>`).join("")
    /* Counting what was ADDED pulls in batches nobody has filled in yet — in the
       last 14 days, 35 of 43 have no avatar recorded. Dropping those silently
       would make every percentage a share of a denominator the card never
       mentions, so say it out loud. */
    +(blank?`<div class="recon"><span>${blank} of the ${rs.length} batches in this window have no `
        +`${esc(spec.t.toLowerCase())} recorded yet — left out of the percentages above</span></div>`:"")
    +(!showChart&&ramp?`<div class="recon"><span>${ent.length} values — past six, colour stops telling classes apart, so this one stays a list</span></div>`:"");
  sub.innerHTML=`<b style="color:var(--ink);font-family:var(--mono);font-size:15px">${tot}</b>`
    +(blank?` of ${rs.length}`:"")+` batches · `
    +aLabel(cardId)+(FILTERS.length?" · filtered":"");
}

function cycleCard(body,sub){
  /* Real elapsed time, not a stand-in: Day Started and Day Launched are both
     set by an Asana rule the moment Status flips, so they are retroactive and
     cost no story calls. Edit time is start→launch; the second column is how
     that landed against the due date, negative meaning early. */
  /* Cycle time reads the MIX window too — over 7 days it is 8 launches and the
     averages swing wildly. Same reason the composition cards use it. */
  const done=analysisRows("cycle").filter(r=>r.launched&&r.started);
  const mk=(key,label)=>{
    const by={};
    done.forEach(r=>{const k=r[key]||"(blank)";
      const o=by[k]=by[k]||{edit:[],late:[]};
      o.edit.push(dBetween(r.started,r.launched));
      if(r.due)o.late.push(dBetween(r.due,r.launched));});
    const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
    const list=Object.entries(by).map(([k,o])=>[k,o.edit.length,avg(o.edit),avg(o.late)])
      .sort((a,b)=>b[2]-a[2]);
    return `<table><thead><tr><th>${label}</th><th>n</th><th>Edit days</th><th>vs due</th></tr></thead><tbody>`
      +(list.length?list.map(([k,n,e,l])=>`<tr class="click" data-dim="${key}" data-val="${esc(k)}">
          <td class="txt">${esc(k)}</td><td>${n}</td><td>${e.toFixed(1)}</td>
          <td>${l==null?"—":(l>0?"+":"")+l.toFixed(1)}</td></tr>`).join("")
        :`<tr><td colspan="4" class="empty">Nothing launched in this range with these filters.</td></tr>`)
      +`</tbody></table>`;
  };
  body.innerHTML=winChip("cycle",false)+`<div class="tw">${mk("bt","Brief type")}<div style="height:10px"></div>${mk("fm","Format")}</div>`;
  sub.innerHTML=`<b style="color:var(--ink);font-family:var(--mono);font-size:15px">${done.length}</b>`
   +` with both dates · ${aLabel("cycle")} · edit days = Day Started → Day Launched · vs due is + late, − early`;
}

/* ---------------- people ----------------
   Leo: "I should be able to hit Utkarsh and then see his total spend, his total
   output, everything like that." Everyone side by side, then one person in full,
   including the per-day action log that was on the gap list (E6/H6). */
function personStats(name,rs){
  const s=spendByRole("s",rs)[name]||{spend:0,purch:0,value:0,n:new Set()};
  const e=spendByRole("e",rs)[name]||{spend:0,purch:0,value:0,n:new Set()};
  const L=launchesInRange(rs);
  const asS=L.filter(x=>x.r.s===name), asE=L.filter(x=>x.r.e===name);
  const liveS=rs.filter(r=>r.s===name&&r.st!=="Launched").length;
  const liveE=rs.filter(r=>r.e===name&&r.st!=="Launched").length;
  const edits=asE.map(x=>x.r).filter(r=>r.started&&r.launched).map(r=>dBetween(r.started,r.launched));
  const acts=EVENTS.filter(ev=>inRange(ev.d)&&ev.by===name).length;
  return {s,e,asS,asE,liveS,liveE,acts,
    avgEdit:edits.length?edits.reduce((a,b)=>a+b,0)/edits.length:null};
}

function peopleCard(body,sub){
  const rs=rows();
  const list=PEOPLE.map(p=>({p,st:personStats(p.name,rs)}))
    .sort((a,b)=>(b.st.asS.length+b.st.asE.length)-(a.st.asS.length+a.st.asE.length));
  body.innerHTML=`<div class="tw"><table><thead><tr>
      <th>Person</th><th>Roles</th><th>Spend as strat</th><th>Spend as editor</th>
      <th>Launched as strat</th><th>Launched as editor</th><th>In flight</th>
      <th>Avg edit days</th><th>Moves logged</th></tr></thead><tbody>`
   +list.map(({p,st})=>`<tr class="click" data-person="${esc(p.name)}">
      <td class="txt"><span class="who">${esc(initials(p.name))}</span> ${esc(p.name)}</td>
      <td class="txt">${p.roles.map(r=>`<span class="pill">${esc(r)}</span>`).join(" ")}</td>
      <td>${st.s.spend?usd(st.s.spend):"·"}</td><td>${st.e.spend?usd(st.e.spend):"·"}</td>
      <td>${st.asS.length||"·"}</td><td>${st.asE.length||"·"}</td>
      <td>${(st.liveS+st.liveE)||"·"}</td>
      <td>${st.avgEdit==null?"·":st.avgEdit.toFixed(1)}</td>
      <td>${st.acts||"·"}</td></tr>`).join("")
   +`</tbody></table></div>`;
  sub.innerHTML=`${PEOPLE.length} people · click a row to open them below`
    +` · <b>spend as strategist</b> and <b>spend as editor</b> are independent partitions of the same money — never add them`;
}

function personCard(body,sub){
  const rs=rows();
  const sel=V.person;
  const chips=`<div class="pgrid">`+PEOPLE.map(p=>
    `<button class="pbtn${sel===p.name?" go":""}" data-person="${esc(p.name)}">
       <span class="who">${esc(initials(p.name))}</span>${esc(p.name)}
       <small>${p.roles.join(" · ")}</small></button>`).join("")+`</div>`;
  if(!sel){
    body.innerHTML=chips+`<div class="empty">Pick a person to see their spend, output and daily actions for ${md(RANGE.from)} → ${md(RANGE.to)}.</div>`;
    sub.textContent="";return;
  }
  const st=personStats(sel,rs);
  const roles=(PEOPLE.find(p=>p.name===sel)||{roles:[]}).roles;

  const tiles=[
    ["Launched as strategist",st.asS.length,"in range"],
    ["Launched as editor",st.asE.length,"in range"],
    ["Spend as strategist",st.s.spend?usd(st.s.spend):"—",st.s.n.size+" batches"],
    ["Spend as editor",st.e.spend?usd(st.e.spend):"—",st.e.n.size+" batches"],
    ["CPA as editor",st.e.purch?"$"+(st.e.spend/st.e.purch).toFixed(2):"—",st.e.purch+" purchases"],
    ["ROAS as editor",st.e.spend?(st.e.value/st.e.spend).toFixed(2):"—","on their batches"],
    ["In flight",st.liveS+st.liveE,"right now"],
    ["Avg edit days",st.avgEdit==null?"—":st.avgEdit.toFixed(1),"start → launch"],
    ["Moves logged",st.acts,"status changes by them"]
  ].map(([k,v,d])=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join("");

  /* the per-day action log — E6/H6, the one requirement that was still open */
  const days=[];for(let d=RANGE.from;d<=RANGE.to;d=addD(d,1))days.push(d);
  const mine=EVENTS.filter(e=>inRange(e.d)&&e.by===sel);
  const launchDay={};[...st.asS,...st.asE].forEach(x=>launchDay[x.d]=(launchDay[x.d]||0)+1);
  const byDay={};mine.forEach(e=>(byDay[e.d]=byDay[e.d]||[]).push(e));
  const strip=days.map(d=>{const n=(byDay[d]||[]).length,l=launchDay[d]||0;
    return `<div class="sd${V.stripSel===d?" sel":""}" data-strip="${d}" title="${d}: ${n} status change${n===1?"":"s"}${l?", "+l+" launched":""}">
      <div class="dw">${dowName(d).slice(0,2)}</div><div class="dn">${+d.slice(8)}</div>
      <div class="v" style="color:${n?"var(--ink)":"var(--ink3)"}">${n||"·"}</div>
      <div class="l">${l?"🚀"+(l>1?l:""):""}</div></div>`;}).join("");
  const selDay=V.stripSel&&byDay[V.stripSel]?byDay[V.stripSel]:null;
  const dayDetail=selDay?`<div class="daydetail feed"><div class="dh">${dowName(V.stripSel)} ${md(V.stripSel)} · ${selDay.length} move${selDay.length===1?"":"s"}</div>`
    +selDay.map(e=>{const b=ROWS.find(x=>x.n===e.n);
      return `<div class="ev"><span class="b">#${e.n}</span>
        <span>${esc(clip(b?b.name:"",40))} ${e.from?`<span class="arrow">·</span> ${esc(em(e.from))} <span class="arrow">→</span> `:""}<b>${esc(em(e.to))}</b></span>
        <span class="sub">${new Date(e.at).toLocaleTimeString("en",{hour:"numeric",minute:"2-digit"})}</span></div>`;}).join("")
    +`</div>`
    :`<div class="sub" style="padding:2px">Click a day for what they moved. Only status changes Asana attributes to them appear here — rule-driven flips have no actor.</div>`;

  /* their output, cut the two ways that matter for each role */
  const outTable=(items,key,label)=>{
    const by={};items.forEach(({r})=>{const v=r[key]||"(blank)";by[v]=(by[v]||0)+1;});
    const list=Object.entries(by).sort((a,b)=>b[1]-a[1]);
    if(!list.length)return `<div class="empty">None in range</div>`;
    return `<table><thead><tr><th>${label}</th><th>n</th></tr></thead><tbody>`
      +list.map(([v,n])=>`<tr><td class="txt">${esc(v)}</td><td>${n}</td></tr>`).join("")+`</tbody></table>`;
  };
  const theirs=rs.filter(r=>r.s===sel||r.e===sel);
  const live=theirs.filter(r=>r.st!=="Launched")
    .sort((a,b)=>(b.age==null?-1:b.age)-(a.age==null?-1:a.age));

  body.innerHTML=chips
   +`<div class="kpis">${tiles}</div>`
   +`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px">
       <div><div class="sub" style="margin-bottom:4px">Output as strategist, by brief type</div>${outTable(st.asS,"bt","Brief type")}</div>
       <div><div class="sub" style="margin-bottom:4px">Output as editor, by format</div>${outTable(st.asE,"fm","Format")}</div>
     </div>`
   +`<div class="sub" style="margin:14px 0 4px">Daily actions · ${md(RANGE.from)} → ${md(RANGE.to)}</div>`
   +`<div class="strip">${strip}</div>${dayDetail}`
   +`<div class="sub" style="margin:14px 0 4px">In flight now · ${live.length} batch${live.length===1?"":"es"}</div>`
   +(live.length?`<div class="tw"><table><thead><tr><th>Batch</th><th>Status</th><th>Days</th>
        <th>Their role</th><th>Spend in range</th><th>Due</th></tr></thead><tbody>`
      +live.map(r=>{const sp=(SPB[r.n]&&SPB[r.n].s)||0;
        return `<tr><td class="txt name"><a class="q" href="${esc(r.url||"#")}" target="_blank" rel="noopener">#${r.n} ${esc(r.name)}</a></td>
        <td class="txt"><span class="pill">${esc(em(r.st))}</span></td>
        <td>${r.age==null?"—":`<span class="ring${r.age>=4?" w":""}">${r.age}${r.sinceEst?"*":""}</span>`}</td>
        <td class="txt">${[r.s===sel?"strategist":"",r.e===sel?"editor":""].filter(Boolean).join(" + ")}</td>
        <td>${sp?usd(sp):"·"}</td>
        <td class="txt" style="color:${r.due&&r.due<TODAY?"var(--hot)":"var(--ink3)"}">${r.due||"—"}</td></tr>`;}).join("")
      +`</tbody></table></div>`
     :`<div class="empty">Nothing in flight.</div>`);
  sub.innerHTML=`<b style="color:var(--ink)">${esc(sel)}</b> · ${roles.join(" · ")} · `
    +`${md(RANGE.from)} → ${md(RANGE.to)}`
    +(FILTERS.length?" · the filters above still apply":"")
    +` · spend as strategist and spend as editor are separate partitions, never a sum`;
}

/* ---------------- calendar ----------------
   "Last N days" ENDS YESTERDAY, exactly like Meta's own preset. Today is a
   partial day and including it made last-7 read $42,217 against Ads Manager's
   $38,637 — the same money, a different window. Matching Meta's convention is
   what lets a number here be checked against Ads Manager without arithmetic.
   Today is its own preset when you do want the partial day. */
let pick={from:null,to:null}, calM=new Date();
let CALFOR="os";        // which window the picker is currently editing
const PRESETS=[["Today",0],["Last 3 days",3],["Last 7 days",7],["Last 14 days",14],["Last 30 days",30],["Last 90 days",90]];
function openCal(){
  const base=CALFOR==="os"?RANGE:winFor(CALFOR);
  const to=base.to||TODAY, from=(base.from&&base.from!=="1970-01-01")?base.from:addD(to,-29);
  pick={from,to}; calM=new Date(to+"T12:00:00Z"); calM.setUTCDate(1);
  $("#calTitle").textContent=CALFOR==="os"
    ? "Date range — the whole OS"
    : "Window for " + ((CARD[CALFOR]&&CARD[CALFOR].t)||"this card");
  $("#presets").innerHTML=PRESETS.map(([l,d])=>`<button data-p="${d}">${l}</button>`).join("")
   +`<button data-w="this">This week</button><button data-w="last">Last week</button><button data-w="month">This month</button>`;
  drawCal(); $("#scrim").hidden=false;
}
function drawCal(){
  const prev=new Date(calM); prev.setUTCMonth(prev.getUTCMonth()-1);
  $("#cals").innerHTML=[prev,calM].map((m,i)=>calHtml(m,i)).join("");
  $("#pickLab").textContent=pick.from?(pick.to?pick.from+" → "+pick.to:pick.from+" → …"):"pick a start day";
}
function calHtml(m,idx){
  const y=m.getUTCFullYear(),mo=m.getUTCMonth();
  const start=(new Date(Date.UTC(y,mo,1)).getUTCDay()+6)%7, dim=new Date(Date.UTC(y,mo+1,0)).getUTCDate();
  let c=""; for(let i=0;i<start;i++)c+="<span></span>";
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const fut=ds>TODAY, edge=ds===pick.from||ds===pick.to,
      mid=pick.from&&pick.to&&ds>pick.from&&ds<pick.to;
    c+=`<button class="day${fut?" future":""}${edge?" edge":mid?" in":""}" ${fut?"disabled":""} data-d="${ds}">${d}</button>`;
  }
  return `<div class="cal"><div class="mh">${idx===0?`<button data-nav="-1">‹</button>`:"<span></span>"}
    <span>${m.toLocaleDateString("en",{month:"long",year:"numeric",timeZone:"UTC"})}</span>
    ${idx===1?`<button data-nav="1">›</button>`:"<span></span>"}</div>
    <div class="grid7">${["m","t","w","t","f","s","s"].map(x=>`<span class="dow">${x}</span>`).join("")}${c}</div></div>`;
}
function setRange(from,to){
  RANGE={from,to};
  const n=dBetween(from,to)+1;
  LABEL = from===TODAY&&to===TODAY ? "Today"
        : to===addD(TODAY,-1) ? "Last "+n+" days"
        : md(from)+" → "+md(to);
}

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");
  if(tb){TAB=tb.dataset.tab;draw();window.scrollTo({top:0});return;}
  const exp=e.target.closest("[data-exp]");
  if(exp){const k=exp.dataset.exp; V.expand.has(k)?V.expand.delete(k):V.expand.add(k); draw(); return;}
  const pr=e.target.closest("[data-person]");
  if(pr){V.person=V.person===pr.dataset.person?null:pr.dataset.person;V.stripSel=null;
    if(TAB!=="ppl"){TAB="ppl";}
    draw();return;}
  const stp=e.target.closest("[data-strip]");
  if(stp){V.stripSel=V.stripSel===stp.dataset.strip?null:stp.dataset.strip;draw();return;}
  const bk=e.target.closest("[data-bk]");
  if(bk){const [b,mode]=bk.dataset.bk.split("|");
    const from=b.length===7?b+"-01":b;
    const to=mode==="day"?from:mode==="week"?addD(from,6)
       :addD(from.slice(0,8)+"01",-1+new Date(Date.UTC(+b.slice(0,4),+b.slice(5),0)).getUTCDate());
    setRange(from,to>TODAY?TODAY:to);draw();return;}
  const lg=e.target.closest("[data-lg]"); if(lg){V.launch.gran=lg.dataset.lg;draw();return;}
  const ls=e.target.closest("[data-ls]"); if(ls){V.launch.split=ls.dataset.ls;draw();return;}
  const fv=e.target.closest("[data-feed]"); if(fv){V.feed=fv.dataset.feed;draw();return;}
  const kn=e.target.closest("[data-kan]"); if(kn){V.kan.scope=kn.dataset.kan;draw();return;}
  const bv=e.target.closest("[data-bview]"); if(bv){V.board.view=bv.dataset.bview;draw();return;}
  const mv=e.target.closest("[data-mixv]"); if(mv){V.mixView=mv.dataset.mixv;draw();return;}
  const wc=e.target.closest("[data-win]"); if(wc){openWinMenu(wc,wc.dataset.win);return;}
  const bg=e.target.closest("[data-bgrp]"); if(bg){V.board.group=bg.dataset.bgrp;draw();return;}
  const bd=e.target.closest("[data-board]"); if(bd){V.board.scope=bd.dataset.board;draw();return;}
  const cal=e.target.closest("[data-cal]");
  if(cal){V.calSel=V.calSel===cal.dataset.cal?null:cal.dataset.cal;draw();return;}
  const bar=e.target.closest(".bar-row"); if(bar){toggle(bar.dataset.dim,bar.dataset.val);return;}
  const cell=e.target.closest("[data-dim][data-val]");
  if(cell){toggle(cell.dataset.dim,cell.dataset.val);return;}
  const row=e.target.closest("tr.click"); if(row&&row.dataset.dim){toggle(row.dataset.dim,row.dataset.val);return;}
  const rm=e.target.closest("[data-rm]");
  if(rm){const [d,v]=rm.dataset.rm.split("|");toggle(d,v);return;}
  if(e.target.id==="clearAll"){FILTERS=[];draw();return;}
  const h=e.target.closest("[data-hide]");
  if(h){lay().hidden.push(h.dataset.hide);draw();return;}
  const th=e.target.closest("[data-sort]");
  if(th){const k=th.dataset.sort;V.sort={k,dir:V.sort.k===k?-V.sort.dir:-1};draw();return;}
  const day=e.target.closest(".day[data-d]");
  if(day){const d=day.dataset.d;
    if(!pick.from||(pick.from&&pick.to))pick={from:d,to:null};
    else if(d<pick.from)pick={from:d,to:pick.from}; else pick.to=d;
    drawCal();return;}
  const nav=e.target.closest("[data-nav]");
  if(nav){calM.setUTCMonth(calM.getUTCMonth()+ +nav.dataset.nav);drawCal();return;}
  const p=e.target.closest("[data-p]");
  if(p){const n=+p.dataset.p;
    pick = n===0 ? {from:TODAY,to:TODAY}                        // Today, partial
                 : {from:addD(TODAY,-n),to:addD(TODAY,-1)};     
    drawCal();return;}
  const w=e.target.closest("[data-w]");
  if(w){const mon=weekStart(TODAY);
    if(w.dataset.w==="this")pick={from:mon,to:TODAY};
    if(w.dataset.w==="last")pick={from:addD(mon,-7),to:addD(mon,-1)};
    if(w.dataset.w==="month")pick={from:TODAY.slice(0,8)+"01",to:TODAY};
    drawCal();return;}
});
 
let dragId=null;
document.addEventListener("mousedown",e=>{
  const c=e.target.closest(".card"); if(c) c.draggable=!!e.target.closest("[data-grab]");
});
document.addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(!c)return;
  dragId=c.dataset.card;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";});
document.addEventListener("dragover",e=>{const c=e.target.closest(".card");
  if(!c||!dragId||c.dataset.card===dragId)return;e.preventDefault();
  document.querySelectorAll(".card.over").forEach(x=>x.classList.remove("over"));c.classList.add("over");});
document.addEventListener("drop",e=>{const c=e.target.closest(".card");
  document.querySelectorAll(".card.over").forEach(x=>x.classList.remove("over"));
  if(!c||!dragId||c.dataset.card===dragId)return;e.preventDefault();
  const o=cardOrder().filter(x=>x!==dragId);o.splice(o.indexOf(c.dataset.card),0,dragId);
  lay().order=o;draw();});
document.addEventListener("dragend",()=>{dragId=null;
  document.querySelectorAll(".card").forEach(x=>{x.draggable=false;x.classList.remove("dragging","over");});});

$("#dateBtn").onclick=()=>{CALFOR="os";openCal();};
$("#cancel").onclick=()=>$("#scrim").hidden=true;
$("#apply").onclick=()=>{
  if(pick.from){
    const to=pick.to||pick.from;
    if(CALFOR==="os") setRange(pick.from,to);
    else { const basis=winFor(CALFOR).basis;
      AWIN[CALFOR]={key:"custom",from:pick.from,to:to,label:md(pick.from)+" → "+md(to),basis}; }
    draw();
  }
  $("#scrim").hidden=true;};
$("#scrim").onclick=e=>{if(e.target.id==="scrim")$("#scrim").hidden=true;};

function popup(anchor,html,wire){
  const old=document.querySelector(".pop"); if(old){old.remove();return null;}
  const pop=document.createElement("div");pop.className="pop";
  const r=anchor.getBoundingClientRect();
  pop.style.top=(r.bottom+7)+"px";pop.style.left=Math.max(8,Math.min(r.left,innerWidth-290))+"px";
  pop.innerHTML=html;document.body.appendChild(pop);wire&&wire(pop);
  setTimeout(()=>{const cl=ev=>{if(!pop.contains(ev.target)){pop.remove();document.removeEventListener("click",cl);}};
    document.addEventListener("click",cl);},0);
  return pop;
}


const WINPRESETS=[["7","Last 7 days"],["14","Last 14 days"],["30","Last 30 days"],
                  ["90","Last 90 days"],["180","Last 6 months"],["all","All time"],
                  ["os","Match the OS range"]];
function openWinMenu(anchor,id){
  const cur=winFor(id);
  popup(anchor,
    `<div class="grp">Window for this card</div>`
    +WINPRESETS.map(([k,l])=>`<div class="row" data-wp="${esc(id)}|${k}">${l}
        ${cur.key===k?'<span class="cnt">✓</span>':""}</div>`).join("")
    +`<div class="row" data-wp="${esc(id)}|pick">Pick dates…</div>`
    +`<div class="grp">Count batches that were</div>`
    +Object.keys(BASES).map(k=>`<div class="row" data-wsc="${esc(id)}|${k}">${BASES[k]}`
        +`${cur.basis===k?'<span class="cnt">✓</span>':""}</div>`).join(""),
    pop=>{
      pop.querySelectorAll("[data-wp]").forEach(el=>el.onclick=()=>{
        const [cid,k]=el.dataset.wp.split("|");
        pop.remove();
        if(k==="pick"){ CALFOR=cid; openCal(); return; }
        const basis=winFor(cid).basis;
        if(k==="all") AWIN[cid]={key:k,from:"1970-01-01",to:TODAY,label:"All time",basis};
        else if(k==="os") AWIN[cid]={key:k,from:RANGE.from,to:RANGE.to,label:"OS range",basis};
        else { const n=+k;
          AWIN[cid]={key:k,from:addD(TODAY,-n),to:addD(TODAY,-1),
            label:n===180?"Last 6 months":"Last "+n+" days",basis}; }
        draw();
      });
      pop.querySelectorAll("[data-wsc]").forEach(el=>el.onclick=()=>{
        const [cid,k]=el.dataset.wsc.split("|");
        winFor(cid).basis=k; pop.remove(); draw();
      });
    });
}



$("#filtBtn").onclick=e=>popup(e.target,
  DIMS.map(d=>{
    const c=countsFor(d,rowsFor(d.k));
    let ent=Object.entries(c).sort((a,b)=>b[1]-a[1]);
    if(d.order) ent.sort((a,b)=>d.order.indexOf(a[0])-d.order.indexOf(b[0]));
    if(!ent.length)return "";
    return `<div class="grp">${esc(d.t)}</div>`+ent.map(([v,n])=>
      `<label class="row"><input type="checkbox" data-f="${esc(d.k)}|${esc(v)}" ${has(d.k,v)?"checked":""}>
        ${esc(v)}<span class="cnt">${n}</span></label>`).join("");
  }).join("")
  +`<div class="row" style="border-top:1px solid var(--soft);margin-top:5px;padding-top:8px">
      <button id="clr" style="flex:1">Clear all filters</button></div>`,
  pop=>{
    pop.querySelectorAll("input[data-f]").forEach(cb=>cb.onchange=()=>{
      const [d,v]=cb.dataset.f.split("|");
      const i=FILTERS.findIndex(f=>f.dim===d&&f.val===v);
      if(i>=0)FILTERS.splice(i,1);else FILTERS.push({dim:d,val:v});
      draw();});
    pop.querySelector("#clr").onclick=()=>{FILTERS=[];pop.remove();draw();};
  });

$("#cardsBtn").onclick=e=>popup(e.target,
  tabOf(TAB).cards.map(id=>`<label class="row"><input type="checkbox" data-c="${id}" ${isHidden(id)?"":"checked"}> ${esc(CARD[id].t)}</label>`).join("")
   +`<div class="row" style="border-top:1px solid var(--soft);margin-top:5px;padding-top:8px">
      <button id="showAll" style="flex:1">Show all</button><button id="resetOrder" style="flex:1">Reset order</button></div>`,
  pop=>{
    pop.querySelectorAll("input[data-c]").forEach(cb=>cb.onchange=()=>{
      const L=lay(), id=cb.dataset.c, i=L.hidden.indexOf(id);
      cb.checked?(i>=0&&L.hidden.splice(i,1)):(i<0&&L.hidden.push(id));draw();});
    pop.querySelector("#showAll").onclick=()=>{lay().hidden=[];pop.remove();draw();};
    pop.querySelector("#resetOrder").onclick=()=>{lay().order=null;pop.remove();draw();};
  });

/* Update now. Served by the web app the page can call the script directly and
   redraw in place — that pull is the FAST one, a short Meta window spliced onto
   what is already stored, because google.script.run has to answer inside the
   execution limit. Opened as a static file it can only re-read the JSON beside
   it, and it says so rather than pretending. */
const HOSTED = typeof google!=="undefined" && google.script && google.script.run;
$("#update").onclick=()=>{
  const b=$("#update"), was=b.textContent;
  if(HOSTED){
    b.disabled=true; b.textContent="Pulling…";
    google.script.run
      .withSuccessHandler(j=>{b.disabled=false;b.textContent=was;adopt(JSON.parse(j));draw();})
      .withFailureHandler(err=>{b.disabled=false;b.textContent=was;
        alert("Pull failed:\n"+(err&&err.message||err)+"\n\nThe page is still showing the last good data.");})
      .osUpdateNow();
  } else {
    b.disabled=true; b.textContent="Re-reading…";
    fetch("./os-data.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.json())
      .then(d=>{const before=DATA&&DATA.generated;adopt(d);draw();
        b.disabled=false;b.textContent=was;
        if(before===d.generated) alert("This is the GitHub Pages copy, which can only re-read what the "
          +"nightly job last wrote — it cannot start a pull.\n\nNothing has changed since "
          +d.generated.slice(0,16).replace("T"," ")+" ET.\n\nOpen the Apps Script web-app URL to force a live pull.");})
      .catch(e=>{b.disabled=false;b.textContent=was;alert("Could not reload os-data.json: "+e.message);});
  }
};
$("#export").onclick=()=>{
  const rs=rows(),h=["batch","name","status","days_in_status","days_estimated","strategist","editor",
    "brief_type","format","ad_type","avatar","awareness","result","spend_in_range","purchases_in_range",
    "due","started","launched","asana_url"];
  const out=[h].concat(rs.map(r=>{const sp=SPB[r.n]||{s:"",p:""};
    return [r.n,r.name,r.st,r.age==null?"":r.age,r.sinceEst?"yes":"no",
      r.s||"",r.e||"",r.bt||"",r.fm||"",r.at||"",r.av||"",r.aw||"",r.res||"",sp.s||0,sp.p||0,
      r.due||"",r.started||"",r.launched||"",r.url||""];}));
  const q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([out.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));
  a.download=`ovia-os-${RANGE.from}_${RANGE.to}.csv`;a.click();URL.revokeObjectURL(a.href);
};



function adopt(d){
  DATA=d; KEYS=d.keys||{}; STATS=d.stats||{}; PEOPLE=d.people||[];
  TODAY=localToday();                       
  DATA_DAY=d.today||TODAY;
  COMPLETE=d.complete||addD(DATA_DAY,-1);   
  ROWS=(d.batches||[]).map(r=>({...r, age:r.since?dBetween(r.since,TODAY):null}));
  EVENTS=d.events||[]; SPEND=d.spend||[];
  
  if(!RANGE.from) setRange(addD(TODAY,-7),addD(TODAY,-1));
  
  
  AWIN={};   
}
function fail(msg){
  document.querySelector("#grid").innerHTML=
    `<div class="card full"><h3>No data</h3><div class="body"><div class="empty">${esc(msg)}</div></div></div>`;
}
loadLayout();
if(BOOT){ adopt(BOOT); draw(); }
else {
  fetch("./os-data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(d=>{adopt(d);draw();})
    .catch(e=>fail("Could not load os-data.json ("+e.message+"). Run masterOsPull in the "
      +"Ovia Master OS Apps Script project, or open this page through the web app."));
}
</script>
